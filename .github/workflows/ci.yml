name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "triton>=3,<4" "pytest>=8" "ruff==0.16.0"
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check --no-cache --output-format=github .
      - name: Test CPU contracts
        run: pytest -m "not cuda"
      - name: AOT compile representative CUDA kernels
        run: python scripts/aot_compile_check.py --arch 80
